name: Exportar a Web y publicar en itch.io

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Version del motor usada por el CI. Mantenerla alineada con la version del
# editor con la que se abre el proyecto (ver config/features en project.godot).
env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  EXPORT_PRESET: "Web"

permissions:
  contents: read

# Si se pushea varias veces seguidas, cancela los builds viejos de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    name: Exportar juego (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Exportar con Godot ${{ env.GODOT_VERSION }}
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz"
          relative_project_path: ./godot
          presets_to_export: ${{ env.EXPORT_PRESET }}
          cache: true

      # La action deja cada preset en <build_directory>/<nombre del preset>/.
      # Lo aplanamos en builds/web porque itch.io necesita index.html en la raiz.
      - name: Recolectar el build
        env:
          BUILD_DIR: ${{ steps.export.outputs.build_directory }}
        run: |
          echo "Exportado por la action:"
          find "$BUILD_DIR" -maxdepth 2
          mkdir -p builds/web
          cp -r "$BUILD_DIR/$EXPORT_PRESET/." builds/web/
          test -f builds/web/index.html
          ls -la builds/web

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: builds/web
          if-no-files-found: error

  deploy-itch:
    name: Publicar en itch.io
    needs: export-web
    # Solo publica en pushes a master: los pull requests unicamente validan el export.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Sin los secrets cargados butler falla con un error poco claro, asi que
      # avisamos y omitimos la publicacion en lugar de dejar el pipeline en rojo.
      - name: Verificar credenciales de itch.io
        id: credenciales
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
        run: |
          faltantes=""
          if [ -z "$BUTLER_API_KEY" ]; then faltantes="$faltantes BUTLER_API_KEY"; fi
          if [ -z "$ITCH_USER" ]; then faltantes="$faltantes ITCHIO_USERNAME"; fi
          if [ -z "$ITCH_GAME" ]; then faltantes="$faltantes ITCHIO_GAME"; fi
          if [ -n "$faltantes" ]; then
            echo "::warning::Faltan estos secrets:$faltantes - se omite la publicacion en itch.io. Ver 'Configuracion inicial' en el README."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar artefacto
        if: steps.credenciales.outputs.listo == 'true'
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: builds/web

      - name: Instalar butler
        if: steps.credenciales.outputs.listo == 'true'
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          "$HOME/butler/butler" -V

      - name: Publicar en itch.io
        if: steps.credenciales.outputs.listo == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
        run: |
          "$HOME/butler/butler" push builds/web "$ITCH_USER/$ITCH_GAME:web" \
            --userversion "build-${{ github.run_number }}"
